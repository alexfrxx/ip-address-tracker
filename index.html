<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./src/style.css" />

    <title>IP Address Tracker</title>
  </head>
  <body>
    <main>
      <div class="finder">
        <h1 class="title">IP Address Tracker</h1>
        <div class="search-bar">
          <input
            type="text"
            class="search-bar__input"
            placeholder="Search for any IP address or domain"
          />
          <button type="button" class="search-bar__btn"></button>
        </div>

        <ul class="info">
          <li class="info__block">
            <p class="info__block-subtitle">IP Address</p>
            <h2 class="info__block-title" id="ip"></h2>
          </li>
          <li class="info__block">
            <p class="info__block-subtitle">Location</p>
            <h2 class="info__block-title" id="location"></h2>
          </li>
          <li class="info__block">
            <p class="info__block-subtitle">Timezone</p>
            <h2 class="info__block-title">UTC <span id="timezone"></span></h2>
          </li>
          <li class="info__block">
            <p class="info__block-subtitle">ISP</p>
            <h2 class="info__block-title" id="isp"></h2>
          </li>
        </ul>
      </div>
      <div id="map"></div>
    </main>

    <script src="./src/index.js"></script>
  </body>
</html>
